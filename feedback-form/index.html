<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Git Introduction | Feedback</title>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">⌥</div>
    <h1>Git Introduction</h1>
    <p>We'd love your feedback on the session</p>
  </header>

  <div class="error-banner" id="errorBanner">
    Something went wrong submitting your feedback. Please try again.
  </div>

  <form id="feedbackForm">

    <div class="card">
      <p class="section-title">Session Content</p>
      <div class="question">
        <label class="q-text">Was the objective of the session clear?</label>
        <div class="options" data-name="objective_clear">
          <label class="opt"><input type="radio" name="objective_clear" value="Yes" required><span>Yes</span></label>
          <label class="opt"><input type="radio" name="objective_clear" value="No"><span>No</span></label>
        </div>
      </div>
      <div class="question">
        <label class="q-text">How informative was the session?</label>
        <div class="options" data-name="informative">
          <label class="opt"><input type="radio" name="informative" value="Excellent" required><span>Excellent</span></label>
          <label class="opt"><input type="radio" name="informative" value="Good"><span>Good</span></label>
          <label class="opt"><input type="radio" name="informative" value="Average"><span>Average</span></label>
          <label class="opt"><input type="radio" name="informative" value="Poor"><span>Poor</span></label>
        </div>
      </div>
      <div class="question">
        <label class="q-text">Did the session meet your expectations?</label>
        <div class="options" data-name="met_expectations">
          <label class="opt"><input type="radio" name="met_expectations" value="Yes" required><span>Yes</span></label>
          <label class="opt"><input type="radio" name="met_expectations" value="Partially"><span>Partially</span></label>
          <label class="opt"><input type="radio" name="met_expectations" value="No"><span>No</span></label>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Organization</p>
      <div class="question">
        <label class="q-text">How well was the session organized?</label>
        <div class="options" data-name="organized">
          <label class="opt"><input type="radio" name="organized" value="Excellent" required><span>Excellent</span></label>
          <label class="opt"><input type="radio" name="organized" value="Good"><span>Good</span></label>
          <label class="opt"><input type="radio" name="organized" value="Average"><span>Average</span></label>
          <label class="opt"><input type="radio" name="organized" value="Poor"><span>Poor</span></label>
        </div>
      </div>
      <div class="question">
        <label class="q-text">Was the time management proper?</label>
        <div class="options" data-name="time_management">
          <label class="opt"><input type="radio" name="time_management" value="Yes" required><span>Yes</span></label>
          <label class="opt"><input type="radio" name="time_management" value="No"><span>No</span></label>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Speaker / Presenter</p>
      <div class="question">
        <label class="q-text">How was the quality of the speaker/presenter?</label>
        <div class="options" data-name="speaker_quality">
          <label class="opt"><input type="radio" name="speaker_quality" value="Excellent" required><span>Excellent</span></label>
          <label class="opt"><input type="radio" name="speaker_quality" value="Good"><span>Good</span></label>
          <label class="opt"><input type="radio" name="speaker_quality" value="Average"><span>Average</span></label>
          <label class="opt"><input type="radio" name="speaker_quality" value="Poor"><span>Poor</span></label>
        </div>
      </div>
      <div class="question">
        <label class="q-text">Was the presentation clear and understandable?</label>
        <div class="options" data-name="presentation_clear">
          <label class="opt"><input type="radio" name="presentation_clear" value="Yes" required><span>Yes</span></label>
          <label class="opt"><input type="radio" name="presentation_clear" value="No"><span>No</span></label>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Facilities</p>
      <div class="question">
        <label class="q-text">Venue arrangements:</label>
        <div class="options" data-name="venue">
          <label class="opt"><input type="radio" name="venue" value="Excellent" required><span>Excellent</span></label>
          <label class="opt"><input type="radio" name="venue" value="Good"><span>Good</span></label>
          <label class="opt"><input type="radio" name="venue" value="Average"><span>Average</span></label>
          <label class="opt"><input type="radio" name="venue" value="Poor"><span>Poor</span></label>
        </div>
      </div>
      <div class="question">
        <label class="q-text">Audio/visual quality:</label>
        <div class="options" data-name="av_quality">
          <label class="opt"><input type="radio" name="av_quality" value="Excellent" required><span>Excellent</span></label>
          <label class="opt"><input type="radio" name="av_quality" value="Good"><span>Good</span></label>
          <label class="opt"><input type="radio" name="av_quality" value="Average"><span>Average</span></label>
          <label class="opt"><input type="radio" name="av_quality" value="Poor"><span>Poor</span></label>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Overall Feedback</p>
      <div class="question">
        <label class="q-text">Overall rating of the session:</label>
        <div class="options" data-name="overall_rating">
          <label class="opt"><input type="radio" name="overall_rating" value="5" required><span>5</span></label>
          <label class="opt"><input type="radio" name="overall_rating" value="4"><span>4</span></label>
          <label class="opt"><input type="radio" name="overall_rating" value="3"><span>3</span></label>
          <label class="opt"><input type="radio" name="overall_rating" value="2"><span>2</span></label>
          <label class="opt"><input type="radio" name="overall_rating" value="1"><span>1</span></label>
        </div>
      </div>
      <div class="question">
        <label class="q-text" for="liked_most">What did you like most about the session?</label>
        <textarea id="liked_most" name="liked_most" placeholder="Optional"></textarea>
      </div>
    </div>

    <button type="submit" id="submitBtn">Submit Feedback</button>
  </form>

  <div id="thankyou">
    <div class="check">✓</div>
    <h2>Thank You!</h2>
    <p>Your feedback has been recorded.</p>
  </div>

</div>
<script type="module" src="/src/main.js"></script>

</body>
</html>
